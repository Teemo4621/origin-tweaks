name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 is not set; the release is signed with a throwaway debug key and cannot be updated in place by the next release."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Name artifact
        id: artifact
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          name="OriginTweaks-v${version}-arm64.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$name"
          sha256sum "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: origin-tweaks-release
          path: |
            ${{ steps.artifact.outputs.name }}
            ${{ steps.artifact.outputs.name }}.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifact.outputs.name }}
            ${{ steps.artifact.outputs.name }}.sha256
          body_path: .github/release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Remove signing material
        if: always()
        run: rm -f android/release.jks android/key.properties
